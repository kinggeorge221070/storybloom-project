<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login or Register | StoryBloom Ghana</title>
    <meta name="description" content="Create an account or log in to access StoryBloom." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="kp.css" />
</head>

<body>
    <header class="topbar">
        <div class="container nav-wrap">
            <a href="kp.html" class="brand" aria-label="StoryBloom home">
                <span class="brand-mark">S</span>
                <span>StoryBloom</span>
            </a>
        </div>
    </header>

    <main class="section-space">
        <div class="container auth-shell">
            <div class="panel auth-panel">
                <div class="auth-header">
                    <span class="eyebrow">Welcome back</span>
                    <h1 class="page-title">Access your account</h1>
                </div>

                <div class="auth-tabs" aria-label="Authentication tabs">
                    <button type="button" class="auth-tab active" data-auth-tab="login">Login</button>
                    <button type="button" class="auth-tab" data-auth-tab="register">Register</button>
                </div>

                <div id="auth-message" class="auth-message" role="alert"></div>

                <form id="login-form" class="auth-form active" data-auth-form="login">
                    <div class="field-group">
                        <label for="login-email">Email address</label>
                        <input id="login-email" name="login-email" type="email" placeholder="you@example.com" required />
                    </div>
                    <div class="field-group">
                        <label for="login-password">Password</label>
                        <input id="login-password" name="login-password" type="password" placeholder="Enter your password" required />
                    </div>
                    <button type="submit" class="btn btn-primary full">Login</button>
                </form>

                <form id="register-form" class="auth-form" data-auth-form="register" style="display: none;">
                    <div class="field-group">
                        <label for="register-name">Full name</label>
                        <input id="register-name" name="register-name" type="text" placeholder="Your full name" required />
                    </div>
                    <div class="field-group">
                        <label for="register-email">Email address</label>
                        <input id="register-email" name="register-email" type="email" placeholder="you@example.com" required />
                    </div>
                    <div class="field-group">
                        <label for="register-password">Password</label>
                        <input id="register-password" name="register-password" type="password" placeholder="Create a password" required />
                    </div>
                    <button type="submit" class="btn btn-primary full">Create account</button>
                </form>
            </div>
        </div>
    </main>

    <script src="kp.js"></script>
</body>

</html>
