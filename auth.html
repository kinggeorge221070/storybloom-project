<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login or Register | StoryBloom Ghana</title>
    <meta name="description" content="Try the StoryBloom sign-in prototype." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="sb.css" />
</head>

<body>
    <header class="topbar">
        <div class="container nav-wrap">
            <a href="index.html" class="brand" aria-label="StoryBloom home">
                <span class="brand-mark">S</span>
                <span>StoryBloom</span>
            </a>
        </div>
    </header>

    <main class="section-space">
        <div class="container auth-shell">
            <div class="panel auth-panel">
                <div class="auth-header">
                    <span class="eyebrow">Prototype access</span>
                    <h1 class="page-title">Try the book builder</h1>
                    <p>Demo only: sign-in and registration are simulated in this browser. No account or password is created.</p>
                </div>

                <div class="auth-tabs" aria-label="Authentication tabs">
                    <button type="button" class="auth-tab active" data-auth-tab="login" aria-selected="true">Login</button>
                    <button type="button" class="auth-tab" data-auth-tab="register" aria-selected="false">Register</button>
                </div>

                <div id="auth-message" class="auth-message" role="alert" hidden></div>

                <form id="login-form" class="auth-form active" data-auth-form="login">
                    <div class="field-group">
                        <label for="login-email">Email address</label>
                        <input id="login-email" name="login-email" type="email" placeholder="you@example.com" autocomplete="email" required />
                    </div>
                    <button type="submit" class="btn btn-primary full">Login</button>
                </form>

                <form id="register-form" class="auth-form" data-auth-form="register" hidden>
                    <div class="field-group">
                        <label for="register-name">Full name</label>
                        <input id="register-name" name="register-name" type="text" placeholder="Your full name" autocomplete="name" required />
                    </div>
                    <div class="field-group">
                        <label for="register-email">Email address</label>
                        <input id="register-email" name="register-email" type="email" placeholder="you@example.com" autocomplete="email" required />
                    </div>
                    <button type="submit" class="btn btn-primary full">Create account</button>
                </form>
            </div>
        </div>
    </main>

    <script src="sb.js"></script>
</body>

</html>
